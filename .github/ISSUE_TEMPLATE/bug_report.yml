name: Bug 报告
description: 报告可重复的软件问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先删除 API Key、客户图纸和其他机密信息。
  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: v272
    validations:
      required: true
  - type: input
    id: sw
    attributes:
      label: SOLIDWORKS / Windows 版本
      placeholder: SOLIDWORKS 2016 SP5 64 位；Windows 10 64 位
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序说明如何稳定复现。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 不要包含 API Key、真实客户图纸或公司机密。


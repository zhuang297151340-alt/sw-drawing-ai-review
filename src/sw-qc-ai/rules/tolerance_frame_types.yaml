# 公差框类型判定规则 v260（以用户 2026-11-04 确认表为准）
independent:
  single_frame: "框数=1 -> 独立公差（单框）"
  multi_different_items: "多个完整框格，每框有自己的几何符号，且符号不全相同 -> 独立公差（多框不同项目）"
combined:
  condition: "多个完整框格，每框有自己的几何符号，且符号全部相同 -> 组合公差框格（多单段）"
  verify: "各框独立验证，并且必须同时满足"
composite:
  condition: "只有一个几何符号，框数>=2，下层无独立符号格 -> 复合公差框格"
  semantics: "上层控制整体位置/形状，下层控制要素间相互关系"
zone:
  CZ: "组合公差带；仅为公差带修饰，不是复合框"
  SZ: "独立公差带；仅为公差带修饰，不是框格类型"
ai_rules:
  - "公差框组ID只表示同一物理标注，不等于复合框"
  - "必须采用插件给出的公差框类别、框格总数、框内顺序和同组完整结构，禁止重新猜类别"
  - "复合框下层有效符号继承上层，但本层原始符号格仍为空"
  - "CZ/SZ与框格类型必须分开记录"

